name: Build NEON SURVIVOR APK

on:
workflow_dispatch:
push:
paths:
- 'NEON_SURVIVOR_Android_Project.zip'
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -o NEON_SURVIVOR_Android_Project.zip -d extracted
      find extracted -name settings.gradle.kts -print

  - name: Locate project
    run: |
      PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")
      echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build debug APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NEON-SURVIVOR-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
